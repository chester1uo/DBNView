name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[all]" pytest pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: Test
        run: python -m pytest -q

  build:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      HAS_WASR: ${{ secrets.LOB_WASR_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[gui]" pyinstaller
      - name: Check out LOB-WASR (MBO replay engine; needs the LOB_WASR_TOKEN secret)
        if: env.HAS_WASR == 'true'
        uses: actions/checkout@v4
        with:
          repository: chester1uo/LOB-WASR
          ref: ${{ vars.LOB_WASR_REF || 'main' }}
          token: ${{ secrets.LOB_WASR_TOKEN }}
          path: .lob-wasr
      - name: Build and install LOB-WASR
        if: env.HAS_WASR == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              brew install zstd pkg-config
              export PKG_CONFIG_PATH="$(brew --prefix zstd)/lib/pkgconfig" ;;
            Linux)
              sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev pkg-config ;;
            Windows)  # static zstd with the dynamic C runtime: nothing extra to ship
              "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zstd:x64-windows-static-md
              export CMAKE_ARGS="-DZSTD_ROOT=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md" ;;
          esac
          python -m pip install ./.lob-wasr
          python -c "import wasr; print('wasr', wasr.__version__)"
          echo "DBNVIEW_EXPECT_REPLAY=LOB-WASR" >> "$GITHUB_ENV"  # the smoke tests then insist on it
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/dbnview.spec
      - name: Sign and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/DBNView.app
          codesign -s - --force --deep dist/DBNView.app
          ditto -c -k --keepParent dist/DBNView.app DBNView-macOS.zip
      - name: Smoke-test the bundle (macOS)
        if: runner.os == 'macOS'
        run: python tools/selftest_app.py dist/DBNView.app/Contents/MacOS/DBNView "$RUNNER_TEMP/smoke"
      - name: Smoke-test the bundle (Windows)
        if: runner.os == 'Windows'
        run: python tools/selftest_app.py dist\DBNView\DBNView.exe "$env:RUNNER_TEMP\smoke"
      - name: Keep the smoke-test screenshots and log
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoketest-${{ runner.os }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/DBNView -DestinationPath DBNView-Windows.zip
      - name: Tar (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf DBNView-Linux.tar.gz DBNView
          python tools/build_web_pyz.py
      - uses: actions/upload-artifact@v4
        with:
          name: DBNView-${{ runner.os }}
          path: |
            DBNView-*.zip
            DBNView-*.tar.gz
            dist/dbnview-web.pyz
