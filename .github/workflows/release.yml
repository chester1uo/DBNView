name: Release

# Push a tag like v0.5.0 (matching dbnview.__version__) to build the installers and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_WASR: ${{ secrets.LOB_WASR_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Smoke-test scripts from this workflow's commit (a rebuilt tag may predate them)
        if: runner.os != 'Linux'
        uses: actions/checkout@v4
        with:
          path: .smoke
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/dbnview/__init__.py').read()).group(1))")
          test "v$VERSION" = "$TAG" || { echo "tag $TAG does not match version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[gui]" pyinstaller
      - name: Check out LOB-WASR (MBO replay engine; needs the LOB_WASR_TOKEN secret)
        if: env.HAS_WASR == 'true'
        uses: actions/checkout@v4
        with:
          repository: chester1uo/LOB-WASR
          ref: ${{ vars.LOB_WASR_REF || 'main' }}
          token: ${{ secrets.LOB_WASR_TOKEN }}
          path: .lob-wasr
      - name: Build and install LOB-WASR
        if: env.HAS_WASR == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              brew install zstd pkg-config
              export PKG_CONFIG_PATH="$(brew --prefix zstd)/lib/pkgconfig" ;;
            Linux)
              sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev pkg-config ;;
            Windows)  # static zstd with the dynamic C runtime: nothing extra to ship
              "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zstd:x64-windows-static-md
              export CMAKE_ARGS="-DZSTD_ROOT=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md" ;;
          esac
          python -m pip install ./.lob-wasr
          python -c "import wasr; print('wasr', wasr.__version__)"
          echo "DBNVIEW_EXPECT_REPLAY=LOB-WASR" >> "$GITHUB_ENV"  # the smoke tests then insist on it
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/dbnview.spec
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/DBNView.app
          codesign -s - --force --deep dist/DBNView.app
          mkdir -p out
          packaging/make_dmg.sh dist/DBNView.app "out/DBNView-$VERSION-macOS-arm64.dmg"
      # Smoke tests run the shipped artifact on the runner's real display (no QT_QPA_PLATFORM=offscreen, which
      # hides crashes in native paint/DPI code); tools/selftest_app.py fails unless every tab is saved as a PNG.
      - name: Smoke-test the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" "out/DBNView-$VERSION-macOS-arm64.dmg"
          rc=0
          python .smoke/tools/selftest_app.py "$MNT/DBNView.app/Contents/MacOS/DBNView" "$RUNNER_TEMP/smoke" || rc=$?
          hdiutil detach "$MNT" || hdiutil detach -force "$MNT"
          exit $rc
      - name: Installer and portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" packaging\dbnview.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item "dist\DBNView-$env:VERSION-Windows-Setup.exe" out\
          Compress-Archive -Path dist\DBNView -DestinationPath "out\DBNView-$env:VERSION-Windows-x64-portable.zip"
      - name: Smoke-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false  # uninstall even if the self-test fails
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          $dir = Join-Path $env:RUNNER_TEMP "DBNView-install"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $setup = Start-Process -FilePath "out\DBNView-$env:VERSION-Windows-Setup.exe" -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$smoke\setup.log`""
          if ($setup.ExitCode -ne 0 -or -not (Test-Path "$dir\DBNView.exe")) {
            Get-Content "$smoke\setup.log" -ErrorAction SilentlyContinue
            throw "installer failed (exit $($setup.ExitCode))"
          }
          python .smoke/tools/selftest_app.py "$dir\DBNView.exe" $smoke
          $rc = $LASTEXITCODE
          $un = Start-Process -FilePath "$dir\unins000.exe" -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$smoke\uninstall.log`""
          # the uninstaller re-launches itself from %TEMP%; give it time to finish removing files
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\DBNView.exe"); $i++) { Start-Sleep 1 }
          if ($rc -ne 0) { throw "self-test failed (exit $rc)" }
          if ($un.ExitCode -ne 0 -or (Test-Path "$dir\DBNView.exe")) {
            Get-Content "$smoke\uninstall.log" -ErrorAction SilentlyContinue
            throw "uninstaller failed (exit $($un.ExitCode))"
          }
      - name: Tarball and web server (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          tar -C dist -czf "out/DBNView-$VERSION-Linux-x64.tar.gz" DBNView
          python tools/build_web_pyz.py
          cp dist/dbnview-web.pyz "out/dbnview-web-$VERSION.pyz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/*
      - name: Keep the smoke-test screenshots
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoketest-${{ runner.os }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DBNView ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: out/*
