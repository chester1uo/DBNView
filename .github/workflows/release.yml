name: Release

# Push a tag like v0.5.0 (matching dbnview.__version__) to build the installers and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/dbnview/__init__.py').read()).group(1))")
          test "v$VERSION" = "$TAG" || { echo "tag $TAG does not match version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[gui]" pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/dbnview.spec
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/DBNView.app
          codesign -s - --force --deep dist/DBNView.app
          mkdir -p out
          packaging/make_dmg.sh dist/DBNView.app "out/DBNView-$VERSION-macOS-arm64.dmg"
      - name: Installer and portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" packaging\dbnview.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item "dist\DBNView-$env:VERSION-Windows-Setup.exe" out\
          Compress-Archive -Path dist\DBNView -DestinationPath "out\DBNView-$env:VERSION-Windows-x64-portable.zip"
      - name: Tarball and web server (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          tar -C dist -czf "out/DBNView-$VERSION-Linux-x64.tar.gz" DBNView
          python tools/build_web_pyz.py
          cp dist/dbnview-web.pyz "out/dbnview-web-$VERSION.pyz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DBNView ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: out/*
